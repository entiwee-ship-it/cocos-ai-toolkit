<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cocos AI 运行工作台</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><strong>Cocos AI 运行工作台</strong></div>
      <div class="runtime-summary">
        <span id="connectionState" class="connection disconnected"><span class="live-dot"></span>模拟器未连接</span>
        <span>场景: <strong id="sceneName">—</strong></span>
        <span>分辨率: <strong id="resolution">—</strong></span>
      </div>
      <div class="toolbar-actions">
        <button id="startButton" class="primary" type="button">启动模拟器</button>
      </div>
    </header>

    <main id="workspace" class="workspace">
      <section class="pane tree-pane" aria-labelledby="treeTitle">
        <header class="pane-header"><h1 id="treeTitle">实时节点树</h1></header>
        <div class="tree-search">
          <label class="search-control">
            <span aria-hidden="true">⌕</span>
            <input id="treeSearch" type="search" placeholder="搜索节点名称、UUID 或路径" autocomplete="off">
          </label>
        </div>
        <div id="treeView" class="tree-view" role="tree" aria-label="实时运行节点树">
          <div class="empty-state">启动或连接 Creator 模拟器后显示真实运行节点</div>
        </div>
        <footer class="pane-footer"><span id="treeMeta">0 个节点 · revision —</span></footer>
      </section>

      <div class="splitter" data-splitter="tree" role="separator" aria-orientation="vertical" aria-label="调整节点树宽度"></div>

      <section class="pane inspector-pane" aria-labelledby="inspectorTitle">
        <header class="pane-header"><h1 id="inspectorTitle">运行时属性</h1></header>
        <div id="selectionHeader" class="selection-header empty">
          <strong id="selectedName">未选择节点</strong>
          <code id="selectedUuid">—</code>
          <code id="selectedPath">—</code>
          <span id="selectionMeta" class="selection-meta">选择节点后显示可用属性</span>
        </div>
        <div id="propertyView" class="property-view">
          <div class="empty-state">从左侧选择一个运行时节点</div>
        </div>
        <footer class="inspector-actions">
          <div class="inspector-action-row">
            <button id="applyButton" class="primary" type="button" disabled>应用并回读</button>
            <button id="revertButton" class="icon-button" type="button" disabled title="还原未应用修改" aria-label="还原未应用修改">↶</button>
          </div>
          <p id="applyStatus">与运行时一致</p>
        </footer>
      </section>

      <div class="splitter" data-splitter="inspector" role="separator" aria-orientation="vertical" aria-label="调整属性面板宽度"></div>

      <section class="pane preview-pane" aria-labelledby="previewTitle">
        <header class="pane-header preview-heading">
          <h1 id="previewTitle">原生模拟器</h1>
          <span id="liveState" class="live-state"><span class="live-dot"></span>等待连接</span>
        </header>
        <div class="preview-process">
          <span id="processName">SimulatorApp-Win32.exe · PID —</span>
          <div class="simulator-settings" aria-label="模拟器显示设置">
            <label>设备
              <select id="resolutionSelect" disabled aria-label="选择模拟器设备分辨率"></select>
            </label>
            <label>方向
              <select id="orientationSelect" disabled aria-label="选择模拟器方向">
                <option value="landscape">横屏</option>
                <option value="portrait">竖屏</option>
                <option value="reverse-landscape">反向横屏</option>
                <option value="reverse-portrait">反向竖屏</option>
              </select>
            </label>
          </div>
        </div>
        <div id="previewStage" class="preview-stage">
          <div id="nativeViewport" class="native-viewport" aria-label="Creator 原生模拟器交互区域">
            <div id="previewPlaceholder" class="preview-placeholder">
              <span class="preview-icon" aria-hidden="true">▶</span>
              <strong>等待嵌入原生 Simulator</strong>
              <span>启动后可直接操作游戏画面</span>
            </div>
          </div>
        </div>
        <section class="console-panel" aria-labelledby="consoleTitle">
          <header class="console-heading">
            <h2 id="consoleTitle">调试控制台</h2>
            <span id="consoleMeta">等待运行</span>
            <button id="clearConsoleButton" type="button" title="清空当前日志">清空</button>
          </header>
          <pre id="consoleView" class="console-view">启动模拟器后显示调试输出</pre>
        </section>
        <footer class="preview-footer">
          <span id="embedMeta">等待嵌入</span>
          <span>原生窗口随工作台自动同步</span>
        </footer>
      </section>
    </main>

    <footer class="statusbar">
      <span>runtimeId: <code id="runtimeId">—</code></span>
      <span>sceneEpoch <code id="sceneEpoch">—</code></span>
      <span class="status-last">最后更新 <span id="lastUpdated">—</span></span>
    </footer>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="/app.js" defer></script>
</body>
</html>
